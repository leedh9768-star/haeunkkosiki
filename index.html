<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>하은이를 꼬셔라!</title>
<style>
  :root{
    --bg-deep: #1b1024;
    --bg-panel: #241531;
    --bubble-me: #ff5d8f;
    --bubble-her: #2f2140;
    --accent: #ffd23f;
    --accent2: #7ce7d4;
    --text-main: #f5eefc;
    --text-dim: #b8a9c9;
    --danger: #ff3b3b;
    --radius: 22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 50% 0%, #2c1a3d 0%, var(--bg-deep) 60%);
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif;
    color: var(--text-main);
    overscroll-behavior: none;
  }
  #app{
    max-width: 480px; margin: 0 auto; min-height: 100vh;
    display:flex; flex-direction:column; position:relative;
    background: var(--bg-panel); box-shadow: 0 0 60px rgba(0,0,0,0.5);
  }
  header{ padding: 14px 16px 10px; background: linear-gradient(180deg, #2c1a3d, rgba(44,26,61,0)); position: sticky; top:0; z-index: 5; }
  .title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .app-name{ font-size: 15px; font-weight: 800; letter-spacing: 0.5px; color: var(--accent); }
  .stage-label{ font-size: 12px; color: var(--text-dim); }
  .heart-track{ display:flex; gap:3px; flex-wrap:wrap; }
  .heart-seg{ flex:1; height:7px; border-radius:4px; background: rgba(255,255,255,0.08); overflow:hidden; min-width: 8px; }
  .heart-seg.cleared{ background: linear-gradient(90deg, var(--bubble-me), #ff9ecb); }

  .photo-wrap{
    margin: 6px 16px 2px; border-radius: var(--radius); overflow:hidden; position:relative;
    aspect-ratio: 4/3; background: linear-gradient(135deg, #3a2350, #1c1128);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .photo-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-fallback{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; padding: 20px; }
  .photo-fallback .emoji{ font-size: 48px; }
  .photo-fallback .hint{ font-size: 11px; color: var(--text-dim); line-height:1.5; }
  .mood-chip{ position:absolute; top:10px; left:10px; background: rgba(0,0,0,0.45); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight:700; }
  .haeun-name-chip{ position:absolute; bottom:10px; left:10px; background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight:800; color: var(--accent); }

  main{ flex:1; padding: 14px 16px 130px; overflow-y:auto; }
  .scene-tag{ font-size: 11px; color: var(--accent2); font-weight:700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px; }
  .her-bubble{ background: var(--bubble-her); border-radius: 4px 18px 18px 18px; padding: 14px 16px; font-size: 15px; line-height:1.55; margin-bottom: 16px; max-width: 92%; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
  .her-bubble b{ color: var(--accent); }

  .choice-btn{
    width:100%; text-align:left; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    color: var(--text-main); padding: 13px 16px; border-radius: 16px; font-size: 14.5px; margin-bottom: 10px;
    cursor:pointer; transition: transform .12s ease, background .12s ease, border-color .12s ease; line-height: 1.4;
  }
  .choice-btn:active{ transform: scale(0.97); }
  .choice-btn:not(:disabled):hover{ background: rgba(255,255,255,0.09); border-color: var(--bubble-me);}
  .choice-btn:disabled{ opacity: 0.5; }

  .reaction-overlay{ position:fixed; inset:0; z-index:50; background: rgba(10,5,15,0.72); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition: opacity .18s ease; }
  .reaction-overlay.show{ opacity:1; pointer-events:auto; }
  .reaction-card{ width:100%; max-width:480px; background: var(--bg-panel); border-radius: 24px 24px 0 0; padding: 22px 20px 26px; transform: translateY(30px); transition: transform .22s cubic-bezier(.2,.9,.3,1.2); border-top: 1px solid rgba(255,255,255,0.1); }
  .reaction-overlay.show .reaction-card{ transform: translateY(0); }
  .reaction-score{ display:inline-block; font-size: 12px; font-weight:800; padding:4px 10px; border-radius: 20px; margin-bottom:10px; }
  .reaction-score.pos{ background: rgba(124,231,212,0.18); color: var(--accent2); }
  .reaction-score.neg{ background: rgba(255,59,59,0.2); color: var(--danger); }
  .reaction-text{ font-size: 15.5px; line-height:1.6; margin-bottom: 18px; }
  .next-btn{ width:100%; padding: 14px; border:none; border-radius:16px; background: var(--bubble-me); color:#fff; font-weight:800; font-size:15px; cursor:pointer; }
  .next-btn.fail{ background: var(--danger); }

  .cover, .ending{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 40px 26px; text-align:center; gap: 16px; }
  .cover .emoji-big, .ending .emoji-big{ font-size: 64px; }
  .cover h1{ font-size: 26px; margin:0; color: var(--accent); font-weight:900; letter-spacing:-0.5px; }
  .cover p, .ending p{ color: var(--text-dim); font-size: 14.5px; line-height:1.7; margin:0; }
  .cover .rule-box{ background: rgba(255,255,255,0.05); border-radius: 16px; padding: 14px 16px; font-size: 13px; text-align:left; color: var(--text-dim); line-height: 1.7; }
  .cover .rule-box b{ color: var(--text-main); }
  .primary-btn{ padding: 15px 34px; border:none; border-radius: 30px; background: linear-gradient(135deg, var(--bubble-me), #ff8fb5); color:#fff; font-weight:900; font-size:16px; cursor:pointer; box-shadow: 0 8px 24px rgba(255,93,143,0.35); }
  .primary-btn.fail-btn{ background: linear-gradient(135deg, #6b1f2b, #3a1017); box-shadow:none; }
  .ending h2{ font-size:22px; margin:0; }
  .ending .score-badge{ font-size: 14px; color: var(--text-dim); }
  .shake{ animation: shake .4s; }
  @keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }
</style>
</head>
<body>
<div id="app">

  <header id="header" style="display:none;">
    <div class="title-row">
      <div class="app-name">💘 하은이를 꼬셔라!</div>
      <div class="stage-label" id="stageLabel">0 / 15</div>
    </div>
    <div class="heart-track" id="heartTrack"></div>
  </header>

  <div id="photoWrap" class="photo-wrap" style="display:none; margin-top:2px;">
    <div class="mood-chip" id="moodChip">😐 평온</div>
    <img id="haeunImg" src="" alt="하은" style="display:none;">
    <div class="photo-fallback" id="photoFallback">
      <div class="emoji" id="fallbackEmoji">🙂</div>
      <div class="hint" id="fallbackHint">사진 준비중</div>
    </div>
    <div class="haeun-name-chip">하은</div>
  </div>

  <main id="main">
    <div class="cover" id="coverScreen">
      <div class="emoji-big">💌</div>
      <h1>하은이를 꼬셔라!</h1>
      <p>이번엔 진짜 진지 모드. 오답 = 즉시 게임오버.<br>당신은 가상의 남자가 되어 <b style="color:#fff">하은</b>과의 15번의 순간을 함께합니다.</p>
      <div class="rule-box">
        <b>⚠️ 목숨 1개.</b> 매 순간 4지선다 중 <b>정답은 딱 하나</b>.<br>
        틀리면 바로 <b>"짜치는 남자.. 노잼.."</b>과 함께 게임 오버.<br>
        정답 위치는 매번 랜덤이니 감으로 찍지 말 것.
      </div>
      <button class="primary-btn" id="startBtn">데이트 시작하기 ▶</button>
    </div>

    <div id="gameScreen" style="display:none;">
      <div class="scene-tag" id="sceneTag"></div>
      <div class="her-bubble" id="herLine"></div>
      <div id="choicesWrap"></div>
    </div>

    <div class="ending" id="endingScreen" style="display:none;">
      <div class="emoji-big" id="endEmoji">🎉</div>
      <h2 id="endTitle"></h2>
      <p id="endDesc"></p>
      <div class="score-badge" id="endScore"></div>
      <button class="primary-btn" id="retryBtn" style="margin-top:10px;">처음부터 다시하기 🔁</button>
    </div>
  </main>

  <div class="reaction-overlay" id="reactionOverlay">
    <div class="reaction-card">
      <div class="reaction-score" id="reactionScore"></div>
      <div class="reaction-text" id="reactionText"></div>
      <button class="next-btn" id="nextBtn">다음 →</button>
    </div>
  </div>

</div>

<script>
/* =========================================================

let stageIndex = 0;
let cleared = 0;
let shuffledStages = []; // per-render shuffled choice arrays

const $ = (id) => document.getElementById(id);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildHeartTrack(){
  const track = $('heartTrack');
  track.innerHTML = '';
  for(let i=0;i<STAGES.length;i++){
    const seg = document.createElement('div');
    seg.className = 'heart-seg';
    track.appendChild(seg);
  }
}

function updateHeartTrack(){
  const segs = document.querySelectorAll('.heart-seg');
  segs.forEach((seg, i) => {
    seg.classList.toggle('cleared', i < cleared);
  });
}

function setPhoto(){
  const img = $('haeunImg');
  const fallback = $('photoFallback');
  $('fallbackEmoji').textContent = '💗';
  $('fallbackHint').innerHTML = `사진 로딩 실패`;
  img.onerror = () => { img.style.display='none'; fallback.style.display='flex'; };
  img.onload = () => { img.style.display='block'; fallback.style.display='none'; };
  img.style.display='none';
  fallback.style.display='flex';
  img.src = PHOTO_FILE;
}

function renderStage(){
  const s = STAGES[stageIndex];
  $('stageLabel').textContent = `${stageIndex+1} / ${STAGES.length}`;
  $('sceneTag').textContent = s.tag;
  $('herLine').innerHTML = s.line;

  const shuffled = shuffle(s.choices);
  const wrap = $('choicesWrap');
  wrap.innerHTML = '';
  shuffled.forEach((c) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.t;
    btn.onclick = () => chooseOption(c);
    wrap.appendChild(btn);
  });
}

function chooseOption(c){
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  const scoreEl = $('reactionScore');
  const nextBtn = $('nextBtn');

  if(c.correct){
    scoreEl.className = 'reaction-score pos';
    scoreEl.textContent = '✅ 성공';
    $('reactionText').innerHTML = c.react;
    nextBtn.textContent = '다음 →';
    nextBtn.className = 'next-btn';
    nextBtn.onclick = () => {
      $('reactionOverlay').classList.remove('show');
      cleared++;
      updateHeartTrack();
      stageIndex++;
      if(stageIndex >= STAGES.length){ showEnding(true); }
      else{ renderStage(); }
    };
  } else {
    scoreEl.className = 'reaction-score neg';
    scoreEl.textContent = '💀 탈락';
    $('reactionText').innerHTML = c.fail;
    nextBtn.textContent = '결과 보기';
    nextBtn.className = 'next-btn fail';
    nextBtn.onclick = () => {
      $('reactionOverlay').classList.remove('show');
      showEnding(false);
    };
  }
  $('reactionOverlay').classList.add('show');
}

function showEnding(success){
  $('header').style.display='none';
  $('photoWrap').style.display='none';
  $('gameScreen').style.display='none';

  const endingEl = $('endingScreen');
  endingEl.style.display='flex';

  if(success){
    $('endEmoji').textContent = '💍';
    $('endTitle').textContent = '완벽한 성공! 커플 탄생 🎉';
    $('endDesc').innerHTML = '15번의 순간을 한 번도 안 틀리고 통과했다.<br>"오빠는 진짜 하나도 안 짜쳐."<br><br>축하합니다, 진짜 능숙한 남자입니다.';
  } else {
    $('endEmoji').textContent = '💀';
    $('endTitle').textContent = '짜치는 남자.. 노잼..';
    $('endDesc').innerHTML = `${STAGES[stageIndex].tag}에서 탈락.<br>하은이 조용히 자리를 떠난다.<br><br>집에 가서 반성하고 다시 도전하자.`;
  }
  $('endScore').textContent = success ? `15 / 15 스테이지 클리어` : `${cleared} / ${STAGES.length} 스테이지까지 성공`;
  $('retryBtn').className = success ? 'primary-btn' : 'primary-btn fail-btn';
}

$('startBtn').onclick = () => {
  $('coverScreen').style.display='none';
  $('header').style.display='block';
  $('photoWrap').style.display='block';
  $('gameScreen').style.display='block';
  buildHeartTrack();
  setPhoto();
  renderStage();
};

$('retryBtn').onclick = () => {
  stageIndex = 0; cleared = 0;
  $('endingScreen').style.display='none';
  $('coverScreen').style.display='flex';
  $('header').style.display='none';
  $('photoWrap').style.display='none';
};
</script>
</body>
</html>
